[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knapsack-optimization"
version = "1.0.0"
description = "Quantum and Classical Knapsack Optimization Pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Lorenzo Coder", email = "lorenzo@example.com"}
]
license = {text = "MIT"}
keywords = ["quantum", "optimization", "knapsack", "qiskit", "pyomo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pyomo>=6.0.0",
    "gurobipy>=13.0.0",
    "qiskit>=2.0.0",
    "qiskit-aer>=0.14.0",
    "qiskit-algorithms>=0.3.0",
    "qiskit-optimization>=0.6.0",
    "dimod>=0.12.0",
    "dwave-neal>=0.6.0",
    "dwave-samplers>=1.3.0",
    "docplex>=2.32.0",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/Lorenzo-coder/knapsack-optimization"
Documentation = "https://github.com/Lorenzo-coder/knapsack-optimization#readme"
Repository = "https://github.com/Lorenzo-coder/knapsack-optimization.git"
"Bug Tracker" = "https://github.com/Lorenzo-coder/knapsack-optimization/issues"

[tool.setuptools]
packages = ["src"]

[tool.uv]
managed = true
